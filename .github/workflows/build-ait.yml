name: Build Mini-app Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 SemVer 태그. 비우면 호출 ref, snapshot 후보는 snapshot_candidate=true 필수"
        type: string
        required: false
        default: ""
      snapshot_candidate:
        description: "vX.Y.Z-snapshot.N 후보 빌드"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: cycle-pair-mini-app-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate candidate contract
    runs-on: seorilabs-rpi-arm64
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          check-latest: false

      - name: Resolve and validate candidate
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          SNAPSHOT_CANDIDATE: ${{ inputs.snapshot_candidate }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            [ "$SNAPSHOT_CANDIDATE" = "false" ] \
              || { echo "snapshot_candidate=true이면 release_tag가 필요합니다." >&2; exit 1; }
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c advice.detachedHead=false checkout --detach "$tag"
          node scripts/validate-release-candidate.mjs \
            --tag "$tag" \
            --snapshot-candidate "$SNAPSHOT_CANDIDATE"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  candidate:
    needs: validate
    uses: seorilabs/.github/.github/workflows/rn-build-ait.yml@73972d2b34e92145e61e3409c91085c40da10c54
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
      ait_dir: apps/ait
      package_manager: pnpm
      pnpm_version: 11.3.0
      node_version: 24.16.0
      install_command: "pnpm install --frozen-lockfile"
      build_command: "pnpm build:ait"
      artifact_path: "apps/ait/cycle-pair.ait"
      # AppsInToss SDK의 Linux Hermes compiler가 x86-64 바이너리다.
      runs_on: ubuntu-latest
