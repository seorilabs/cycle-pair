name: Cleanup Actions Storage

on:
  workflow_dispatch:
    inputs:
      delete_artifacts:
        type: boolean
        default: true
      delete_caches:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    uses: seorilabs/.github/.github/workflows/cleanup-actions-storage.yml@9afa357f9ba6c8d6a813c7cec7ad3d35c626bdd5
    secrets: inherit
    with:
      delete_artifacts: ${{ inputs.delete_artifacts }}
      delete_caches: ${{ inputs.delete_caches }}
      dry_run: ${{ inputs.dry_run }}
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
