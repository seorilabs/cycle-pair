name: Cleanup Actions Storage

on:
  workflow_dispatch:
    inputs:
      delete_artifacts:
        type: boolean
        default: true
      delete_caches:
        type: boolean
        default: true
      dry_run:
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    uses: seorilabs/.github/.github/workflows/cleanup-actions-storage.yml@565fba53aa5053785c63c9b732b93a3fbd7be847
    with:
      delete_artifacts: ${{ inputs.delete_artifacts }}
      delete_caches: ${{ inputs.delete_caches }}
      dry_run: ${{ inputs.dry_run }}
      runs_on: ${{ github.event.repository.private && 'seorilabs-rpi-arm64' || 'ubuntu-latest' }}
