name: Deploy Google Play

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드하고 internal 트랙에 업로드할 stable SemVer 태그. 비우면 최신 vX.Y.Z"
        type: string
        required: false
        default: ""
      upload:
        description: "검증된 signed AAB를 Google Play internal 트랙에 업로드"
        type: boolean
        required: false
        default: false
      release_status:
        description: "internal 트랙 release 상태"
        type: choice
        options:
          - draft
          - completed
        default: draft
      changes_not_sent_for_review:
        description: "가능한 경우 검토 제출 없이 edit commit"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload:
        type: boolean
        required: false
        default: false
      release_status:
        type: string
        required: false
        default: draft
      changes_not_sent_for_review:
        type: boolean
        required: false
        default: false
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64:
        required: false
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64:
        required: true
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD:
        required: true
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD:
        required: false

permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: cycle-pair-google-play-${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: seorilabs/.github/.github/workflows/rn-deploy-google-play.yml@main
    with:
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
      upload: ${{ inputs.upload || false }}
      track: internal
      release_status: ${{ inputs.release_status || 'draft' }}
      changes_not_sent_for_review: ${{ inputs.changes_not_sent_for_review || false }}
      package_manager: pnpm
      pnpm_version: 11.3.0
      node_version: 24.16.0
      java_version: 17
      android_dir: apps/mobile/android
      package_name: com.seorilabs.cyclepair
      firebase_restore_script: scripts/restore-mobile-firebase-config.mjs
      timeout_minutes: 45
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
