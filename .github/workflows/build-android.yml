name: Build Android Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 SemVer 태그. snapshot 후보는 snapshot_candidate=true 필수"
        type: string
        required: false
        default: ""
      snapshot_candidate:
        description: "vX.Y.Z-snapshot.N 후보 빌드"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: cycle-pair-android-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/deploy-google-play.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      snapshot_candidate: ${{ inputs.snapshot_candidate }}
      upload: false
      release_status: draft
      changes_not_sent_for_review: false
