name: Build Android Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 SemVer 태그. 비우면 최신 vX.Y.Z"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cycle-pair-android-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: seorilabs/.github/.github/workflows/rn-build-android.yml@c3cd0aef1b68500fcda241ade27759e2a61419a5
    secrets: inherit
    with:
      release_tag: ${{ inputs.release_tag }}
      package_manager: pnpm
      pnpm_version: 11.3.0
      node_version: 24.16.0
      java_version: "21"
      android_dir: apps/mobile/android
      react_native_architectures: armeabi-v7a,arm64-v8a
      signing_properties_file: keystore.properties
