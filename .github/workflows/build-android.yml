name: Build Android Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 SemVer 태그. 비우면 최신 vX.Y.Z"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: cycle-pair-android-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    uses: ./.github/workflows/deploy-google-play.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      upload: false
      release_status: draft
      changes_not_sent_for_review: false
