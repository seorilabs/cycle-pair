name: Deploy App Store via Xcode Cloud

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 SemVer 태그. 비우면 최신 vX.Y.Z"
        type: string
        required: false
        default: ""
      upload_to_testflight:
        description: "Xcode Cloud Archive와 TestFlight 업로드 시작"
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        default: ""
      upload_to_testflight:
        type: boolean
        default: false
    secrets:
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: cycle-pair-xcode-cloud-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  app-store:
    uses: seorilabs/.github/.github/workflows/app-store-xcode-cloud.yml@565fba53aa5053785c63c9b732b93a3fbd7be847
    with:
      release_tag: ${{ inputs.release_tag }}
      # upload_to_testflight=false면 제품·workflow·태그 해석까지만 하고 빌드를 시작하지
      # 않는다. 중앙 워크플로의 start 입력이 같은 뜻이다.
      start: ${{ inputs.upload_to_testflight }}
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
