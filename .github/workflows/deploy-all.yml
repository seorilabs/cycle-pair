name: Deploy All Markets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "빌드할 SemVer 태그. 비우면 최신 vX.Y.Z"
        type: string
        required: false
        default: ""
      google_play:
        description: "Google Play 빌드 실행"
        type: boolean
        default: true
      google_play_upload:
        description: "Google Play internal track 업로드"
        type: boolean
        default: false
      google_play_release_status:
        description: "Google Play internal release 상태"
        type: choice
        options:
          - draft
          - completed
        default: draft
      apps_in_toss:
        description: "AppsInToss 비공개 업로드 실행"
        type: boolean
        default: false
      apps_in_toss_memo:
        description: "AppsInToss 비공개 배포 메모"
        type: string
        required: false
        default: "Cycle Pair private upload"
      app_store:
        description: "App Store archive 실행"
        type: boolean
        default: false
      app_store_upload:
        description: "App Store Connect 업로드(TestFlight)"
        type: boolean
        default: false

# 재사용 워크플로는 caller 보다 넓은 권한을 요구할 수 없다. 여기 permissions 는
# 호출하는 deploy-google-play / deploy-apps-in-toss 가 선언한 것의 상위집합이어야
# 하고, 아니면 job 이 아니라 run 전체가 startup_failure 로 죽는다.
permissions:
  contents: read
  id-token: write
  packages: read

concurrency:
  group: cycle-pair-deploy-all-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    uses: seorilabs/.github/.github/workflows/resolve-release-version.yml@main
    with:
      release_tag: ${{ inputs.release_tag }}

  google-play:
    name: Google Play
    needs: resolve
    if: ${{ inputs.google_play }}
    uses: ./.github/workflows/deploy-google-play.yml
    secrets:
      FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
      GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD }}
      GOOGLE_PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEY_PASSWORD }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload: ${{ inputs.google_play_upload }}
      release_status: ${{ inputs.google_play_release_status }}
      changes_not_sent_for_review: false


  app-store:
    name: App Store
    needs: resolve
    if: ${{ inputs.app_store }}
    uses: ./.github/workflows/deploy-app-store.yml
    secrets:
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
      FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      upload: ${{ inputs.app_store_upload }}

  apps-in-toss:
    name: AppsInToss
    needs: resolve
    if: ${{ inputs.apps_in_toss }}
    uses: ./.github/workflows/deploy-apps-in-toss.yml
    secrets:
      APPS_IN_TOSS_API_KEY: ${{ secrets.APPS_IN_TOSS_API_KEY }}
    with:
      release_tag: ${{ needs.resolve.outputs.tag }}
      memo: ${{ inputs.apps_in_toss_memo }}
