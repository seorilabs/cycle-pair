pluginManagement {
    def pluginPackageJson = providers.exec {
        workingDir(settingsDir.parentFile)
        commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json')")
    }.standardOutput.asText.get().trim()
    settings.ext.reactNativeGradlePluginDir = new File(pluginPackageJson).parentFile.absolutePath
    includeBuild(settings.ext.reactNativeGradlePluginDir)
}
plugins { id("com.facebook.react.settings") }
settings.ext.reactNativeCliPath = providers.exec {
    workingDir(settingsDir.parentFile)
    commandLine("node", "--print", "require.resolve('@react-native-community/cli/build/bin.js')")
}.standardOutput.asText.get().trim()
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(["node", settings.ext.reactNativeCliPath, "config"])
}
rootProject.name = 'CyclePair'
include ':app'
includeBuild(settings.ext.reactNativeGradlePluginDir)
