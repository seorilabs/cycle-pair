nodeLinker: hoisted
packages:
  - apps/*
  - packages/*
  - firebase/functions

patchedDependencies:
  react-native-keychain@10.0.0: patches/react-native-keychain@10.0.0.patch

allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  '@swc/core': true
  esbuild: true
  protobufjs: true
  re2: true

minimumReleaseAgeExclude:
  - '@seorilabs/platform-sdk@0.6.0'
