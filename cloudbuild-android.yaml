# 평시 릴리즈 경로는 중앙 GitHub Actions(rn-deploy-google-play.yml)다. 이 파일은
# Actions 로 갈 수 없을 때 되돌아올 폴백이다.
#
# 자격증명은 Secret Manager 가 아니라 일회성 GCS 객체로 들어온다. 폴백이라 워크플로가
# 올려주지 않고, 되돌릴 때 사람이 로컬 카탈로그에서 직접 올린다. 로컬 원본이
# source of truth 이고 ~/.config/seorilabs 아래에 있다.
#
# 되돌리는 방법:
#   B="gs://seorilabs-ci-build-credentials/seorilabs/cycle-pair/manual-$(date +%s)"
#   C="$HOME/.config/seorilabs"; D="$(mktemp -d)"; umask 077
#   base64 -i "$C/firebase/cycle-pair-google-services.json" | tr -d '\n' > "$D/firebase-android-config.b64"
#   base64 -i "$C/play-store/cycle-pair-upload.jks"         | tr -d '\n' > "$D/play-keystore.b64"
#   grep '^GOOGLE_PLAY_UPLOAD_KEYSTORE_PASSWORD=' "$C/play-store/cycle-pair-keystore.env" | cut -d= -f2- | tr -d '\n' > "$D/play-keystore-password"
#   grep '^GOOGLE_PLAY_UPLOAD_KEY_PASSWORD='      "$C/play-store/cycle-pair-keystore.env" | cut -d= -f2- | tr -d '\n' > "$D/play-key-password"
#   for f in "$D"/*; do gcloud storage cp "$f" "$B/$(basename "$f")"; done
#   gcloud builds submit . --project=seorilabs-ci --config=cloudbuild-android.yaml \
#     --substitutions="_RELEASE_TAG=v1.2.3,_RELEASE_VERSION_NAME=1.2.3,_RELEASE_VERSION_CODE=...,_ARTIFACT_BUCKET=gs://...,_CREDENTIAL_BUCKET=$B"
#   rm -rf "$D"
#
# 입력은 scripts/build-android.sh 의 required_environment 를 그대로 따른다. 2026-09-01(#60)에
# 스크립트가 SEORI_RELEASE_* 를 요구하도록 바뀌었는데 이 파일이 따라가지 않아 폴백이
# 첫 필수값 검사에서 멈추는 상태였다. check-multimarket-builds.test.mjs 가 이제 스크립트의
# 목록을 직접 읽어 이 파일과 대조한다.
#
substitutions:
  _RELEASE_TAG: ""
  _RELEASE_VERSION_NAME: ""
  _RELEASE_VERSION_CODE: ""
  _GOOGLE_PLAY_UPLOAD_KEY_ALIAS: "upload"
  _ARTIFACT_BUCKET: "gs://seorilabs-ci-build-artifacts/seorilabs/cycle-pair/manual"
  _CREDENTIAL_BUCKET: ""

steps:
  # rm 에 `|| true` 를 붙이지 않는다. prefix 는 제출 직전에 사람이 만든 것이라 반드시
  # 존재하고, 삭제 실패는 키스토어가 GCS 에 남았다는 뜻이다. 빌드 맨 앞 단계라
  # 세워도 긴 AAB 빌드를 낭비하지 않는다.
  - id: fetch-ephemeral-credentials
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        install -d -m 0700 /workspace/.ci-secrets
        for name in \
          firebase-android-config.b64 \
          play-keystore.b64 \
          play-keystore-password \
          play-key-password; do
          gcloud storage cp "${_CREDENTIAL_BUCKET}/$$name" "/workspace/.ci-secrets/$$name"
          chmod 0600 "/workspace/.ci-secrets/$$name"
        done
        gcloud storage rm --recursive "${_CREDENTIAL_BUCKET}"

  # builder 이미지는 US 사본을 쓴다. default pool 은 미국에서 실행되므로 서울 사본을 당기면
  # 빌드마다 수 GB 가 대륙간 egress 로 붙는다. 두 사본의 digest 는 같다.
  - id: build-signed-aab
    name: us-docker.pkg.dev/seorilabs-ci/builders/rn-android-builder:node24-jdk17-android36
    entrypoint: bash
    args:
      - scripts/build-android.sh
    env:
      - SEORI_RELEASE_TAG=${_RELEASE_TAG}
      - SEORI_RELEASE_VERSION_NAME=${_RELEASE_VERSION_NAME}
      - SEORI_RELEASE_VERSION_CODE=${_RELEASE_VERSION_CODE}
      - GOOGLE_PLAY_UPLOAD_KEY_ALIAS=${_GOOGLE_PLAY_UPLOAD_KEY_ALIAS}
      - BUILD_CREDENTIAL_DIR=/workspace/.ci-secrets

artifacts:
  objects:
    location: ${_ARTIFACT_BUCKET}
    paths:
      - dist/android/cycle-pair.aab

options:
  # machineType 은 적지 않는다. default pool 기본 머신이 e2-standard-2 로 같은 사양이고,
  # 적어두면 제출하는 gcloud 버전에 따라 `.options.machineType: unused` 로 거절된다.
  # 폴백은 사람이 로컬 gcloud 로 제출하므로 버전을 고정할 수 없다.
  logging: CLOUD_LOGGING_ONLY

timeout: 7200s
