appId: ${APP_ID}
---
- tapOn:
    id: home-record
- assertNotVisible: 'Add a note|남기고 싶은 내용을 적어주세요'
- tapOn:
    id: record-emotions
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible:
              id: record-emotion-calm
              selected: false
          commands:
            - tapOn:
                id: record-emotion-calm
                selected: false
      - assertVisible:
          id: record-emotion-calm
          selected: true
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible:
              id: record-emotion-calm
              checked: false
          commands:
            - tapOn:
                id: record-emotion-calm
                checked: false
      - assertVisible:
          id: record-emotion-calm
          checked: true
- tapOn: 'Done|완료'
- tapOn:
    id: record-help
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible:
              id: record-help-2
              selected: false
          commands:
            - tapOn:
                id: record-help-2
                selected: false
      - assertVisible:
          id: record-help-2
          selected: true
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible:
              id: record-help-2
              checked: false
          commands:
            - tapOn:
                id: record-help-2
                checked: false
      - assertVisible:
          id: record-help-2
          checked: true
- tapOn: 'Done|완료'
- takeScreenshot: safe/record-summary
- tapOn:
    id: record-details
- scrollUntilVisible:
    element:
      id: record-note
    direction: DOWN
- longPressOn:
    id: record-note
- runFlow:
    when:
      visible: 'Select All|Select all|전체 선택|모두 선택'
    commands:
      - tapOn: 'Select All|Select all|전체 선택|모두 선택'
      - eraseText: 1
- inputText: ${SYNTHETIC_NOTE}
- assertVisible: ${SYNTHETIC_NOTE}
- takeScreenshot: safe/record-note-keyboard
- runFlow: dismiss-keyboard.yaml
- runFlow: record-save.yaml
