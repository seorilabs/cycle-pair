appId: ${APP_ID}
---
- assertTrue: ${APP_ID === 'com.seorilabs.cyclepair.qa'}
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: home-record
    timeout: 60000
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      text: '.*(Notifications and privacy|알림과 개인정보).*'
    direction: DOWN
    centerElement: true
- tapOn: '.*(Notifications and privacy|알림과 개인정보).*'
- scrollUntilVisible:
    element:
      id: privacy-open
    direction: DOWN
    centerElement: true
- tapOn:
    id: privacy-open
- assertVisible:
    id: privacy-center
- assertVisible: 'You control your records and sharing|내 기록과 공유를 직접 통제해요'
- assertVisible: '(?s).*(Health data consent|민감정보 동의).*2026-08-09-v1.*'
- scrollUntilVisible:
    element:
      text: '(?s).*(After confirming your current password in account settings|계정 설정에서 내 데이터를).*'
    direction: DOWN
    centerElement: true
- takeScreenshot: safe/privacy-rights
- tapOn:
    id: privacy-close
- assertNotVisible:
    id: privacy-center
- assertVisible:
    id: diagnostics-toggle
- tapOn: 'Back|뒤로'
- tapOn:
    id: tab-home
- assertVisible:
    id: home-record
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      text: 'About|앱 안내'
    direction: DOWN
    centerElement: true
- tapOn: 'About|앱 안내'
- scrollUntilVisible:
    element:
      text: 'View privacy information|개인정보 안내 보기'
    direction: DOWN
    centerElement: true
- tapOn: 'View privacy information|개인정보 안내 보기'
- assertVisible:
    id: privacy-center
- assertVisible: 'You control your records and sharing|내 기록과 공유를 직접 통제해요'
- takeScreenshot: safe/privacy-about
- tapOn:
    id: privacy-close
- assertNotVisible:
    id: privacy-center
- assertVisible: 'View privacy information|개인정보 안내 보기'
- tapOn: 'Back|뒤로'
- tapOn:
    id: tab-home
- assertVisible:
    id: home-record
