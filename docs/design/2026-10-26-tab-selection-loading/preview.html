<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cycle Pair 선택 표시 시안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f1f7;color:#3a3242;font-family:system-ui,sans-serif;padding:24px 12px}main{max-width:760px;margin:auto}h1{font-size:24px;line-height:1.35;margin:0 0 10px}p{line-height:1.6;margin:8px 0 18px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:24px}label{display:flex;gap:6px;align-items:center}select,button{font:inherit}select{padding:8px;border:1px solid #c9bdcf;border-radius:10px;background:white}.phone{width:360px;max-width:100%;margin:0 auto;background:#fbf4e6;border:1px solid #d7cddd;border-radius:26px;overflow:hidden;--scale:1}.phone.gray{filter:grayscale(1)}.content{padding:24px 20px;min-height:330px}.eyebrow{font-size:12px;color:#6d6277}.heading{font-size:calc(24px * var(--scale));font-weight:800;line-height:1.3;margin:12px 0 22px}.card{background:white;padding:20px;border-radius:24px}.card-title{font-size:calc(17px * var(--scale));font-weight:700;margin:0 0 10px}.message{font-size:calc(14px * var(--scale));line-height:1.55;margin:0 0 18px}.action{background:#5e4d96;color:white;border:0;border-radius:16px;padding:14px 12px;width:100%;min-height:48px;font-size:calc(15px * var(--scale));font-weight:700}.action:disabled{background:#e9e2f5;color:#6d6277}.tabs{display:flex;flex-wrap:wrap;background:white;padding:8px 4px 12px;border-top:1px solid #efe6dc}.tab{flex:0 0 25%;border:0;padding:0 4px;background:none;color:#6d6277;cursor:pointer;min-height:56px}.tab-face{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:12px 4px 7px;border-radius:16px;min-width:0}.tab[aria-selected=true] .tab-face{background:#e9e2f5}.tab[aria-selected=true] .tab-face:before{content:"";position:absolute;top:4px;width:22px;height:3px;background:#5e4d96;border-radius:999px}.tab img{width:24px;height:24px;object-fit:contain}.tab .more{display:flex;align-items:center;justify-content:center;width:24px;height:24px;font-size:23px;line-height:1}.tab .label{font-size:calc(11px * var(--scale));line-height:1.35;overflow-wrap:anywhere;font-weight:600}.tab[aria-selected=true]{color:#5e4d96}.tab[aria-selected=true] .label{font-weight:800}.phone.large{--scale:2}.large .tab{flex-basis:50%}.caption{font-size:13px;color:#6d6277;max-width:440px;margin:18px auto 0}.phone button:focus-visible{outline:3px solid #5e4d96;outline-offset:-3px}
</style>
<main>
<h1>지금 선택한 탭을 한눈에</h1>
<p id="intro">선택한 탭에 둥근 배경, 짧은 표시선과 굵은 이름을 함께 보여 줍니다. 설계용 시안이며 앱에 아직 반영되지 않았습니다.</p>
<div class="controls">
<label>언어 <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label>
<label><input type="checkbox" id="large">글자 200%</label>
<label><input type="checkbox" id="gray">흑백</label>
<label>기록 상태 <select id="status"><option value="slow">오래 대기</option><option value="loading">조회 중</option><option value="ready">조회 완료</option><option value="error">조회 오류</option></select></label>
</div>
<section class="phone" aria-label="설계용 앱 화면">
<div class="content"><span class="eyebrow">CYCLE PAIR · 설계용 예시</span><div class="heading" id="heading"></div><div class="card"><p class="card-title" id="card-title"></p><p class="message" id="message"></p><button class="action" id="action"></button></div></div>
<nav class="tabs" role="tablist" aria-label="Main navigation">
<button class="tab" data-key="home" role="tab" aria-selected="true"><span class="tab-face"><img src="../../../apps/mobile/src/assets/brand/icons/home.png" alt=""><span class="label"></span></span></button>
<button class="tab" data-key="calendar" role="tab" aria-selected="false"><span class="tab-face"><img src="../../../apps/mobile/src/assets/brand/icons/calendar.png" alt=""><span class="label"></span></span></button>
<button class="tab" data-key="partner" role="tab" aria-selected="false"><span class="tab-face"><img src="../../../apps/mobile/src/assets/brand/icons/pair.png" alt=""><span class="label"></span></span></button>
<button class="tab" data-key="settings" role="tab" aria-selected="false"><span class="tab-face"><span class="more" aria-hidden="true">⋯</span><span class="label"></span></span></button>
</nav>
</section>
<p class="caption">각 탭을 눌러 보세요. 흑백과 큰 글자에서도 선택 표시를 확인할 수 있습니다. 아래 기록 상태는 합성 예시이며 서버에 접속하지 않습니다.</p>
</main>
<script>
const copy={ko:{tabs:['오늘','달력','파트너','설정'],head:'오늘의 나를 다정하게',title:'오늘의 기록',slow:'기록을 가져오는 데 시간이 걸려요.',loading:'기록 불러오는 중…',ready:'오늘의 마음을 남겨 보세요.',error:'기록을 불러오지 못했어요.',retry:'다시 시도',record:'오늘 기록하기'},en:{tabs:['Today','Calendar','Partner','Settings'],head:'A little kindness for today',title:'Today’s note',slow:'Your records are taking longer to load.',loading:'Loading record…',ready:'Make a little space for how you feel.',error:'Could not load records.',retry:'Retry',record:'Record my day'}};
function render(){const c=copy[document.querySelector('#language').value],s=document.querySelector('#status').value;document.documentElement.lang=document.querySelector('#language').value;document.querySelector('h1').textContent=document.documentElement.lang==='ko'?'지금 선택한 탭을 한눈에':'Know where you are at a glance';document.querySelector('#heading').textContent=c.head;document.querySelector('#card-title').textContent=c.title;document.querySelector('#message').textContent=c[s];document.querySelector('#action').textContent=s==='loading'?c.loading:s==='ready'?c.record:c.retry;document.querySelector('#action').disabled=s==='loading';document.querySelectorAll('.tab').forEach((t,i)=>{t.querySelector('.label').textContent=c.tabs[i];t.setAttribute('aria-label',c.tabs[i]);});document.querySelector('.phone').classList.toggle('large',document.querySelector('#large').checked);document.querySelector('.phone').classList.toggle('gray',document.querySelector('#gray').checked);}
document.querySelectorAll('.controls input,.controls select').forEach(e=>e.addEventListener('change',render));document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(other=>other.setAttribute('aria-selected',String(other===t)));}));document.querySelector('#action').addEventListener('click',()=>{document.querySelector('#status').value='loading';render();});render();
</script>
</html>
