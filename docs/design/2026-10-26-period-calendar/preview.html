<style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;color:#3a3242;background:#f5f1f7;margin:0;padding:24px 12px}main{max-width:850px;margin:auto}h1{font-size:24px;margin:0 0 10px}p{line-height:1.5}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.controls label{display:flex;gap:6px;align-items:center}button,select{font:inherit;cursor:pointer}select{padding:8px;border:1px solid #c8bdd0;border-radius:10px}.phone{--scale:1;width:360px;max-width:100%;margin:auto;background:#fbf4e6;border:1px solid #d7cddd;border-radius:24px;overflow:hidden}.phone.large{--scale:2}.phone.gray{filter:grayscale(1)}.content{padding:20px 12px}.eyebrow{font-size:12px;color:#6d6277}.title{font-size:calc(24px * var(--scale));line-height:1.3;font-weight:800;margin:8px 0 20px}.card{background:white;border-radius:22px;padding:16px;margin:14px 0}.month-row{display:flex;align-items:center;gap:4px;margin-bottom:14px}.month{font-size:calc(19px * var(--scale));font-weight:800;flex:1;line-height:1.4;min-width:0;text-align:center}.nav-button{background:#f6f0e3;border:0;min-width:42px;min-height:48px;border-radius:14px;font-size:23px;color:#5e4d96}.today{border:1px solid #d1c5e4;background:white;border-radius:12px;min-height:48px;padding:8px;font-size:calc(13px * var(--scale));color:#5e4d96;max-width:100%;overflow-wrap:anywhere}.month-tools{display:flex;justify-content:flex-end;margin-bottom:10px}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}.week span{text-align:center;font-size:calc(11px * var(--scale));font-weight:600;color:#6d6277;padding-bottom:8px}.day{position:relative;min-height:48px;padding:4px 0;border:0;background:none;display:flex;align-items:center;justify-content:center;isolation:isolate}.day .number{display:flex;align-items:center;justify-content:center;width:100%;height:34px;font-size:calc(13px * var(--scale));color:#3a3242;border-radius:0;position:relative}.day.actual .number{background:#f9e5dc}.day.actual.start .number{border-radius:999px 0 0 999px}.day.actual.end .number{border-radius:0 999px 999px 0}.day.actual.start.end .number{border-radius:999px}.day.forecast .number{border:1.5px dashed #ae6976;border-radius:999px}.day.selected:after{content:"";position:absolute;inset:3px 1px;border:2px solid #5e4d96;border-radius:14px;z-index:1;pointer-events:none}.day.today-mark:before{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:#3a3242;z-index:2}.day.other .number{opacity:.42}.legend{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 0;font-size:calc(11px * var(--scale));color:#6d6277}.legend span{display:flex;gap:5px;align-items:center}.swatch{width:18px;height:12px;background:#f9e5dc;border-radius:6px;flex-shrink:0}.swatch.prediction{border:1.5px dashed #ae6976;background:none}.swatch.selection{border:2px solid #5e4d96;background:none}.heading{font-size:calc(17px * var(--scale));font-weight:800;line-height:1.4;margin:0 0 10px}.detail{font-size:calc(14px * var(--scale));line-height:1.55;margin:8px 0;color:#6d6277;overflow-wrap:anywhere}.private{font-size:calc(12px * var(--scale));margin:10px 0;color:#5e4d96;line-height:1.5}.primary{display:block;width:100%;min-height:48px;padding:14px 10px;border:0;border-radius:16px;background:#5e4d96;color:white;font-size:calc(15px * var(--scale));font-weight:700;overflow-wrap:anywhere}.primary:disabled{background:#e9e2f5;color:#6d6277}.history-list{display:flex;flex-direction:column;gap:8px}.history{border:0;border-radius:14px;min-height:48px;background:#f6f0e3;color:#3a3242;padding:12px;text-align:left;font-size:calc(13px * var(--scale));line-height:1.5}.basis{font-size:calc(12px * var(--scale));line-height:1.5;color:#6d6277;margin:12px 0 0}.feedback{background:#e4ebe0;border-radius:12px;padding:12px;font-size:calc(13px * var(--scale));line-height:1.5}.tabs{display:flex;flex-wrap:wrap;background:white;border-top:1px solid #efe6dc;padding:8px 4px 12px}.tab{flex:0 0 25%;border:0;background:none;padding:0 4px;min-width:0;color:#6d6277;min-height:58px}.tab-face{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;min-height:58px;padding:12px 2px 7px;border-radius:16px;position:relative}.tab img{width:24px;height:24px}.tab .name{font-size:calc(11px * var(--scale));overflow-wrap:anywhere}.tab.active .tab-face{background:#e9e2f5}.tab.active .tab-face:before{content:"";position:absolute;top:4px;width:22px;height:3px;border-radius:99px;background:#5e4d96}.tab.active .name{color:#5e4d96;font-weight:800}.large .tab{flex-basis:50%}.caption{max-width:430px;margin:20px auto;font-size:13px;color:#6d6277}dialog{width:340px;max-width:calc(100vw - 24px);border:0;border-radius:24px;padding:20px;color:#3a3242;background:#fbf4e6;max-height:85vh;overflow:auto;--scale:1}dialog.large{--scale:2}dialog::backdrop{background:#3a324273}.close{float:right;border:0;background:white;color:#5e4d96;min-width:44px;min-height:44px;border-radius:14px}.option{display:flex;align-items:center;gap:12px;background:white;border-radius:16px;padding:14px;margin:10px 0;font-size:calc(15px * var(--scale));line-height:1.5;min-height:52px}.option input{width:22px;height:22px;flex-shrink:0;accent-color:#5e4d96}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #5e4d96;outline-offset:2px}
.phone{height:min(860px,calc(100dvh - 24px));display:flex;flex-direction:column}.content{min-height:0;overflow-y:auto;flex:1}.action-dock{flex-shrink:0;padding:10px 12px;background:#fbf4e6;border-top:1px solid #efe6dc}.dock-date{font-size:calc(12px * var(--scale));color:#6d6277;margin:0 0 7px}.tabs{flex-shrink:0}dialog[open]{display:flex;flex-direction:column}.editor-content{overflow-y:auto;min-height:0;flex:1}#save{flex-shrink:0;margin-top:12px}</style>
<main><h1>날짜에서 시작하는 나의 기록</h1><p>날짜에서 생리 시작과 종료를 바로 남기고 과거 기록을 고칩니다.</p>
<div class="controls"><label>언어 <select id="language"><option value="ko">한국어</option><option value="en">English</option></select></label><label><input type="checkbox" id="large">글자 200%</label><label><input type="checkbox" id="gray">흑백</label></div>
<section class="phone" aria-label="설계용 달력"><div class="content"><div class="eyebrow">CYCLE PAIR · 설계용 예시</div><h2 class="title" id="title"></h2>
<div class="card"><div class="month-row"><button class="nav-button" id="previous">‹</button><div class="month" id="month"></div><button class="nav-button" id="next">›</button></div><div class="month-tools"><button class="today" id="today"></button></div><div class="week" id="week"></div><div class="grid" id="grid"></div><div class="legend" id="legend"></div></div>
<div class="card"><h3 class="heading" id="selected-date"></h3><p class="detail" id="selected-detail"></p><p class="detail" id="note"></p><p class="private" id="private"></p><p class="detail" id="future"></p><div class="feedback" id="feedback" hidden role="status"></div></div>
<div class="card"><h3 class="heading" id="history-title"></h3><div class="history-list" id="history"></div><p class="basis" id="basis"></p></div>
<p class="basis" id="reference"></p>
</div><div class="action-dock"><p class="dock-date" id="dock-date"></p><button class="primary" id="edit"></button></div><nav class="tabs" aria-label="Main navigation"><button class="tab"><span class="tab-face"><img src="../../../apps/mobile/src/assets/brand/icons/home.png" alt=""><span class="name" data-name="0"></span></span></button><button class="tab active" aria-current="page"><span class="tab-face"><img src="../../../apps/mobile/src/assets/brand/icons/calendar.png" alt=""><span class="name" data-name="1"></span></span></button><button class="tab"><span class="tab-face"><img src="../../../apps/mobile/src/assets/brand/icons/pair.png" alt=""><span class="name" data-name="2"></span></span></button><button class="tab"><span class="tab-face"><span aria-hidden="true">⋯</span><span class="name" data-name="3"></span></span></button></nav></section>
<p class="caption">설계용 합성 자료입니다. 실제 계정, 서버와 연결되지 않으며 변경은 이 창에서만 유지됩니다. 예상 날짜와 평균은 고정된 설계용 예시입니다. 10월 1일 또는 5일을 선택해 생리 표시를 고쳐 보세요. 10월 2일에는 보존할 예시 메모가 있습니다.</p>
</main>
<dialog id="editor" aria-labelledby="editor-title"><div class="editor-content"><button class="close" id="close" aria-label="Close">×</button><h2 class="heading" id="editor-title"></h2><p class="detail" id="editor-date"></p><label class="option"><input type="checkbox" id="started"><span id="started-label"></span></label><label class="option"><input type="checkbox" id="ended"><span id="ended-label"></span></label><p class="detail" id="editor-help"></p></div><button class="primary" id="save"></button></dialog>
<script>
const $=s=>document.querySelector(s),today='2026-10-26';let cursor='2026-10',selected=today;const logs=new Map([['2026-08-05',{start:true}],['2026-08-09',{end:true}],['2026-09-02',{start:true}],['2026-09-06',{end:true}],['2026-10-01',{start:true}],['2026-10-05',{end:true}],['2026-10-02',{note:true}]]);
const copy={ko:{title:'나의 주기 달력',today:'오늘로',actual:'실제 기록',predicted:'예상',selected:'선택 날짜',edit:'생리 기록',history:'지난 주기',noRecord:'이 날짜에 남긴 생리 표시는 없어요.',start:'생리 시작을 기록했어요.',end:'생리 종료를 기록했어요.',both:'시작과 종료를 같은 날로 기록했어요.',inside:'직접 기록한 생리 기간에 포함돼요.',missing:'종료일 미입력',unpaired:'시작일 확인 필요',private:'나만의 기록이에요. 공유 설정은 그대로 유지돼요.',future:'미래 날짜에는 실제 생리 기록을 남기지 않아요.',editor:'이 날짜의 생리',started:'이 날 시작했어요',ended:'이 날 끝났어요',help:'하루였다면 둘 다 켜세요. 둘 다 끄면 생리 표시만 지우고 다른 기록은 보존해요.',save:'이 날짜 저장',saved:'시안에 저장했어요. 다른 기록은 보존했어요.',note:'메모: 따뜻한 차를 마시며 쉬었어요.',basis:'설계용 예시: 기록 간격 2개, 평균 29일',reference:'예상은 참고용이에요. 피임이나 진단에 사용하지 마세요.',tabs:['오늘','달력','파트너','설정'],intro:'날짜에서 생리 시작과 종료를 바로 남기고 과거 기록을 고칩니다.',headline:'날짜에서 시작하는 나의 기록',previous:'이전 달',next:'다음 달'},en:{title:'Your cycle calendar',today:'Today',actual:'Logged period',predicted:'Estimate',selected:'Selected',edit:'Log period',history:'Past periods',noRecord:'No period marker for this date.',start:'Period start logged.',end:'Period end logged.',both:'Start and end logged on the same day.',inside:'Within a period you recorded.',missing:'End not recorded',unpaired:'Start needs review',private:'Your private record. Sharing settings stay as you chose.',future:'You can only log an actual period for today or a past date.',editor:'Period for this date',started:'Started on this day',ended:'Ended on this day',help:'Select both for a one-day period. Clear both to remove only these markers and keep other notes.',save:'Save this date',saved:'Saved in this preview. Other notes were kept.',note:'Note: A quiet break with warm tea.',basis:'Design example: 2 recorded intervals, average 29 days',reference:'Estimates are for reference, not diagnosis or contraception.',tabs:['Today','Calendar','Partner','Settings'],intro:'Log a start or end from a date, and correct past records.',headline:'Your records, one date at a time',previous:'Previous month',next:'Next month'}};
function c(){return copy[$('#language').value]}function date(d){return new Date(d+'T12:00:00')}function iso(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function fmt(d,opts={month:'short',day:'numeric'}){return new Intl.DateTimeFormat($('#language').value==='ko'?'ko-KR':'en-US',opts).format(date(d))}
function ranges(){const list=[],entries=[...logs].sort(([a],[b])=>a.localeCompare(b));let start;for(const [day,log]of entries){if(log.start){if(start)list.push({start});start=day}if(log.end){if(start){list.push({start,end:day});start=undefined}else list.push({end:day})}}if(start)list.push({start});return list}
function render(){const t=c();document.documentElement.lang=$('#language').value;$('h1').textContent=t.headline;$('main>p').textContent=t.intro;$('.phone').classList.toggle('large',$('#large').checked);$('.phone').classList.toggle('gray',$('#gray').checked);$('#editor').classList.toggle('large',$('#large').checked);$('#title').textContent=$('#large').checked?($('#language').value==='ko'?'달력':'Calendar'):t.title;$('#month').textContent=fmt(cursor+'-01',{year:'numeric',month:'long'});$('#today').textContent=t.today;$('#previous').ariaLabel=t.previous;$('#next').ariaLabel=t.next;$('#week').replaceChildren(...Array.from({length:7},(_,i)=>{const s=document.createElement('span');s.textContent=fmt('2026-10-'+String(18+i),{weekday:'narrow'});s.ariaLabel=fmt('2026-10-'+String(18+i),{weekday:'long'});return s}));
 const periods=ranges(),first=date(cursor+'-01');first.setDate(first.getDate()-first.getDay());$('#grid').replaceChildren(...Array.from({length:42},(_,i)=>{const d=new Date(first);d.setDate(first.getDate()+i);const key=iso(d),b=document.createElement('button');b.className='day';b.dataset.date=key;const r=periods.find(p=>p.start&&((p.end&&key>=p.start&&key<=p.end)||key===p.start));if(r){b.classList.add('actual');if(key===r.start)b.classList.add('start');if(key===r.end||!r.end)b.classList.add('end')}if(key>='2026-10-28'&&key<='2026-11-01')b.classList.add('forecast');if(key===selected)b.classList.add('selected');if(key===today)b.classList.add('today-mark');if(!key.startsWith(cursor))b.classList.add('other');b.ariaLabel=fmt(key,{year:'numeric',month:'long',day:'numeric'})+(r?', '+t.actual:'')+(b.classList.contains('forecast')?', '+t.predicted:'');b.setAttribute('aria-pressed',String(key===selected));const n=document.createElement('span');n.className='number';n.textContent=d.getDate();b.append(n);b.onclick=()=>{selected=key;$('#feedback').hidden=true;render()};return b}));
 $('#legend').innerHTML=['actual','predicted','selected'].map((k,i)=>'<span><i aria-hidden="true" class="swatch '+['','prediction','selection'][i]+'"></i>'+t[k]+'</span>').join('');$('#selected-date').textContent=fmt(selected,{month:'long',day:'numeric',weekday:'short'});const log=logs.get(selected)||{},inside=periods.some(p=>p.start&&p.end&&selected>=p.start&&selected<=p.end);$('#selected-detail').textContent=log.start&&log.end?t.both:log.start?t.start:log.end?t.end:inside?t.inside:t.noRecord;$('#note').textContent=log.note?t.note:'';$('#private').textContent=t.private;$('#dock-date').textContent=fmt(selected,{month:'long',day:'numeric'});$('#edit').textContent=t.edit;$('#edit').ariaLabel=fmt(selected,{year:'numeric',month:'long',day:'numeric'})+', '+t.edit;$('#edit').disabled=selected>today;$('#future').textContent=selected>today?t.future:'';$('#history-title').textContent=t.history;$('#history').replaceChildren(...periods.reverse().map(p=>{const b=document.createElement('button');b.className='history';b.textContent=p.start?fmt(p.start)+(p.end?' – '+fmt(p.end):' / '+t.missing):fmt(p.end)+' / '+t.unpaired;b.onclick=()=>{selected=p.start||p.end;cursor=selected.slice(0,7);render()};return b}));$('#basis').textContent=t.basis;$('#reference').textContent=t.reference;document.querySelectorAll('[data-name]').forEach(e=>e.textContent=t.tabs[Number(e.dataset.name)]);$('#editor-title').textContent=t.editor;$('#started-label').textContent=t.started;$('#ended-label').textContent=t.ended;$('#editor-help').textContent=t.help;$('#save').textContent=t.save;}
$('#previous').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);function shift(n){const d=date(cursor+'-01');d.setMonth(d.getMonth()+n);cursor=iso(d).slice(0,7);render()}$('#today').onclick=()=>{cursor=today.slice(0,7);selected=today;render()};$('#edit').onclick=()=>{const log=logs.get(selected)||{};$('#started').checked=!!log.start;$('#ended').checked=!!log.end;$('#editor-date').textContent=fmt(selected,{year:'numeric',month:'long',day:'numeric'});$('#editor').showModal()};$('#close').onclick=()=>$('#editor').close();$('#save').onclick=()=>{const old=logs.get(selected)||{};logs.set(selected,{...old,start:$('#started').checked,end:$('#ended').checked});$('#editor').close();render();$('#feedback').textContent=c().saved;$('#feedback').hidden=false};document.querySelectorAll('.controls input,.controls select').forEach(e=>e.onchange=render);render();
</script></html>
