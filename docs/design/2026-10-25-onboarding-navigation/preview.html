<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cycle Pair — 작은 기록, 더 가까운 우리</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;background:#f0ece7;color:#3A3242;font-size:16px;--cream:#FBF4E6;--purple:#5E4D96;--line:#ded4c8;--muted:#6d6277}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #5E4D96;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.toolbar{max-width:1100px;margin:20px auto 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;font-size:13px;color:var(--muted)}.toolbar button,.toolbar select{background:white;border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:44px}.workspace{max-width:1050px;margin:14px auto 40px;display:grid;grid-template-columns:1fr 390px;gap:60px;padding:0 20px}.notes{padding-top:45px}.notes h1{font-size:40px;line-height:1.35;letter-spacing:-1.2px;font-weight:650;margin:16px 0 24px}.notes p{max-width:430px;font-size:16px;line-height:1.8;color:var(--muted)}.tag{color:var(--purple);font-size:12px;letter-spacing:.08em;font-weight:700}.tokens{display:flex;gap:8px;margin:28px 0}.tokens i{width:30px;height:30px;border-radius:50%;border:1px solid #3a324220}.phone{background:var(--cream);min-height:760px;border-radius:30px;border:1px solid var(--line);box-shadow:0 20px 60px #3a324214;overflow:hidden;display:flex;flex-direction:column}.nav{padding:12px 20px 4px;min-height:55px;display:flex;align-items:center;justify-content:space-between}.nav button,.text{border:0;background:transparent;color:var(--purple);padding:10px 2px;min-height:44px}.brand{font-size:14px;font-weight:700;color:var(--purple);letter-spacing:.02em}.progress{padding:6px 24px 0}.bars{display:flex;gap:6px}.bars i{height:3px;border-radius:4px;background:#ded5cd;flex:1}.bars .done{background:var(--purple)}.stage{font-size:12px;color:var(--muted);margin:10px 0}.body{padding:20px 24px 12px;flex:1}.body h2{font-size:28px;line-height:1.35;letter-spacing:-.8px;font-weight:650;margin:0 0 12px;overflow-wrap:anywhere}.desc{font-size:15px;line-height:1.65;color:var(--muted);margin:0 0 22px}.hero{width:calc(100% + 48px);margin:-8px -24px 10px;display:block;aspect-ratio:1.5;object-fit:contain}.primary,.secondary{width:100%;border:0;border-radius:16px;background:var(--purple);color:white;min-height:54px;padding:14px 16px;font-weight:650;line-height:1.45}.secondary{border:1px solid var(--purple);background:transparent;color:var(--purple)}.footer{padding:16px 24px 24px;display:grid;gap:10px}.footer .text{width:100%;font-size:14px}.icon{width:24px;height:24px;object-fit:contain;flex-shrink:0;vertical-align:middle}.button-content{display:flex;gap:10px;align-items:center;justify-content:center}.choices{display:grid;gap:12px}.choice{display:flex;align-items:center;gap:16px;width:100%;border:1px solid var(--line);background:#fffdfa;padding:18px 16px;border-radius:20px;text-align:left;min-height:88px}.choice .icon{width:32px;height:32px}.choice strong{font-size:17px;display:block;margin-bottom:6px}.choice small{font-size:13px;line-height:1.5;color:var(--muted)}.choice.selected{border:2px solid var(--purple);padding:17px 15px;background:#f0ebf8}.hint{font-size:13px;line-height:1.7;color:var(--muted);margin:16px 0}.field label{display:block;font-size:14px;margin:16px 0 10px;font-weight:600}.field input,.field textarea{width:100%;min-height:56px;border:1px solid #a295ac;background:#fffdfa;border-radius:14px;padding:14px;font-size:18px}.field textarea{font-size:16px;line-height:1.6;resize:vertical;min-height:105px}.card{padding:20px;border-radius:22px;background:#fffdfa;border:1px solid var(--line);margin:18px 0}.card.lavender{background:#eee8f6;border-color:#e4daef}.card.sage{background:#e8eee4;border-color:#d9e2d2}.card h3{font-size:18px;line-height:1.45;margin:0 0 12px;font-weight:650}.card p{font-size:14px;line-height:1.6;margin:8px 0;color:var(--muted)}.small-label{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 10px}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;background:#f0ebf8;border-radius:999px;font-size:13px;margin:4px 4px 4px 0}.pill .icon{width:17px;height:17px}.example{font-size:12px;color:#6d6277;letter-spacing:.02em}.consent{display:flex;gap:12px;line-height:1.7;font-size:15px;margin:20px 0}.consent input{width:23px;height:23px;accent-color:var(--purple);flex-shrink:0}.error{color:#9c283c;font-size:14px;line-height:1.6;margin:12px 0}.quiet{display:flex;align-items:center;gap:8px;color:var(--purple);font-size:13px;line-height:1.7}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0 4px}.day{text-align:center;font-size:11px;line-height:1.6;color:var(--muted)}.day .dot{display:grid;place-items:center;min-height:33px;border-radius:13px;background:#ede7df;margin:5px 0;color:#75677e}.day .dot.filled{background:#E9E2F5;color:var(--purple);border:1px solid #b9a8d4}.day .dot.today{outline:1.5px solid var(--purple);outline-offset:2px}.day .icon{width:19px;height:19px}.moods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mood{min-height:86px;padding:12px 6px;display:flex;flex-direction:column;gap:9px;align-items:center;border:1px solid var(--line);background:#fffdfa;border-radius:18px;font-size:13px}.mood.selected{border:2px solid var(--purple);background:#E9E2F5}.mood .icon{width:30px;height:30px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:10px 12px 16px;gap:10px}.tabs button{border:0;background:none;min-height:52px;display:flex;align-items:center;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}.tabs button.active{color:var(--purple);font-weight:700}.chart{display:grid;gap:10px;margin:12px 0}.bar-row{display:grid;grid-template-columns:64px minmax(0,1fr) 42px;gap:8px;align-items:center;font-size:13px}.bar-track{height:12px;border-radius:10px;background:#eee7df;overflow:hidden}.bar-fill{height:100%;border-radius:10px;background:#a594c9}.empty{padding:25px 0;text-align:center}.empty .icon{width:44px;height:44px;margin-bottom:12px}.success{width:48px;height:48px;background:#E4EBE0;border-radius:50%;display:grid;place-items:center;font-size:26px;color:#45623f;margin-bottom:20px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row button{border:0;background:transparent;color:var(--purple);min-height:44px}.switch-row{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:14px;line-height:1.5}.switch-row input{width:21px;height:21px;accent-color:var(--purple)}.hidden{display:none}@media(max-width:700px){body{background:var(--cream)}.toolbar{margin:0;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;gap:6px}.workspace{display:block;margin:0;padding:0}.notes{display:none}.phone{border:0;border-radius:0;box-shadow:none;min-height:calc(100dvh - 66px);max-width:520px;margin:auto}.body{padding-top:20px}.hero{max-height:240px}.toolbar select{max-width:135px}}@media(prefers-reduced-motion:no-preference){.body{animation:appear .15s ease-out}@keyframes appear{from{opacity:.7;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
<div class="toolbar"><span id="prototype-label">설계용 예시, 실제 인증과 저장 없음</span><button id="language">English</button><select id="scene" aria-label="화면 예시"><option value="entry">시작</option><option value="home">오늘</option><option value="record">기록</option><option value="calendar">나의 흐름</option><option value="partner">파트너</option><option value="empty">빈 기록</option></select><button id="reset">처음부터</button></div>
<main class="workspace"><aside class="notes"><span class="tag">CYCLE PAIR · GLOBAL LAUNCH</span><h1>작은 기록,<br>더 가까운 우리.</h1><p>나를 먼저 살피고, 나누고 싶은 마음만 건네요. 이미지와 짧은 문구가 오늘의 기록을 편안하게 시작하도록 돕습니다.</p><div class="tokens"><i style="background:#FBF4E6"></i><i style="background:#7C69B8"></i><i style="background:#DE8E76"></i><i style="background:#8FA98C"></i><i style="background:#3A3242"></i></div><p>이메일 계정과 게스트로 시작합니다. 구독과 IAP를 없애고 이번 출시는 무료, 광고 없음으로 진행합니다. 전면광고와 보상광고는 후속 계획입니다.</p><p>그래프는 남긴 기록만 보여줍니다. 연속 기록 경쟁이나 파트너의 마음을 추측하는 점수는 만들지 않습니다.</p></aside><section class="phone" aria-label="앱 미리보기"><header class="nav"><button id="back">이전</button><span class="brand">cycle pair</span><span style="width:34px"></span></header><div id="progress" class="progress"></div><div id="body" class="body"></div><footer id="footer" class="footer"></footer><nav id="tabs" class="tabs hidden" aria-label="앱 화면"></nav></section></main>
<script>
let lang='ko',step='entry',history=[],account='guest',draft={mode:null,consent:false,date:'',cycle:'',period:'',mood:null,note:''},empty=false,sharing={mood:false,energy:false},notice='';
const $=id=>document.getElementById(id),T=(ko,en)=>lang==='ko'?ko:en;
const icon=(name)=>`<img class="icon" src="assets/icons/${name}.svg" alt="" aria-hidden="true">`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const go=s=>{history.push(step);step=s;notice='';render();window.scrollTo(0,0)};
function button(label,fn,style='primary',disabled=false){const b=document.createElement('button');b.className=style;b.textContent=label;b.disabled=disabled;b.onclick=fn;$('footer').append(b);return b}
function heading(a,b){$('body').innerHTML=`<h2>${a}</h2><p class="desc">${b}</p>`}
function choice(id,art,title,desc,fn,selected=false){$('body').insertAdjacentHTML('beforeend',`<button id="${id}" class="choice ${selected?'selected':''}" aria-pressed="${selected}">${icon(art)}<span><strong>${title}</strong><small>${desc}</small></span></button>`);$(id).onclick=fn}
const moodOptions=[['calm','leaf','편안해요','Calm'],['happy','sun','기분 좋아요','Bright'],['tired','moon','지쳤어요','Tired'],['low','cloud','가라앉아요','Low'],['space','cup','쉬고 싶어요','Need rest']];
function tabs(){const active=['home','record','saved'].includes(step)?'home':step;$('tabs').classList.remove('hidden');$('tabs').innerHTML=[['home','home',T('오늘','Today')],['calendar','calendar',T('나의 흐름','My days')],['partner','pair',T('파트너','Partner')]].map(([s,i,t])=>`<button data-tab="${s}" class="${active===s?'active':''}" ${active===s?'aria-current="page"':''}>${icon(i)}${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab))}
function render(){document.documentElement.lang=lang;$('body').innerHTML='';$('footer').innerHTML='';$('progress').innerHTML='';$('tabs').classList.add('hidden');$('back').textContent=T('이전','Back');$('back').style.visibility=history.length?'visible':'hidden';$('language').textContent=T('English','한국어');$('reset').textContent=T('처음부터','Reset');$('prototype-label').textContent=T('설계용 예시, 실제 인증과 저장 없음','Design sample. No real sign-in or saving.');
 const steps=['purpose','consent',...(draft.mode==='cycle'?['date','cycle','period']:[]),'tutorial','share'];let n=steps.indexOf(step);if(n>=0)$('progress').innerHTML=`<div class="bars">${steps.map((_,i)=>`<i class="${i<=n?'done':''}"></i>`).join('')}</div><p class="stage">${T('내게 맞게 시작하기','Make it yours')} ${n+1} / ${steps.length}</p>`;
 if(step==='entry'){
  $('body').innerHTML=`<img class="hero" src="assets/quiet-together.png" alt=""><p class="tag">A LITTLE CLOSER, EVERY DAY</p><h2>${T('오늘의 나를,<br>조금 더 다정하게.','A little space<br>to understand each other.')}</h2><p class="desc">${T('나를 위한 작은 기록.<br>함께하고 싶은 마음만 나눠요.','Small notes for yourself.<br>Share only what feels right.')}</p>`;
  button(T('이메일로 시작하기','Start with email'),()=>go('account'));
  button(T('계정 없이 시작하기','Start without an account'),()=>{account='guest';go('purpose')},'secondary');
  $('footer').insertAdjacentHTML('beforeend',`<div class="hint">${T('게스트 기록을 다른 기기에서 이어가려면 나중에 계정을 연결해 주세요.','Connect an account later to recover guest records on another device.')}</div>`);
 }else if(step==='account'){
  heading(T('기록을 이어갈 수 있도록','Keep your days with you'),T('이메일 계정으로 기록과 파트너 연결을 복구할 수 있어요.','An email account lets you recover your records and partner connection.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="card sage">${icon('mail')}<p>${T('이 화면은 설계 예시입니다. 실제 이메일이나 비밀번호를 입력하지 않습니다.','This is a design sample. Do not enter a real email or password.')}</p></div>`);
  button(T('새 이메일 계정으로 시작한 예시','Example: new email account'),()=>{account='email';go('purpose')});
  button(T('기존 계정을 복구한 예시','Example: restore an account'),()=>{account='email';go('home')},'secondary');
 }else if(step==='purpose'){
  heading(T('어떤 기록이 필요하세요?','What would you like to track?'),T('내게 필요한 것부터 시작해요. 나중에 설정에서 바꿀 수 있어요.','Start with what you need. You can change this in settings.'));
  $('body').insertAdjacentHTML('beforeend','<div class="choices" id="purpose-choices"></div>');
  choice('cycle','cycle',T('주기와 컨디션','Cycle and condition'),T('생리 기록과 오늘의 몸, 마음','Period dates, body and mood'),()=>{draft.mode='cycle';render()},draft.mode==='cycle');
  choice('condition','leaf',T('컨디션만','Condition only'),T('주기 질문 없이 몸과 마음 기록','Body and mood, without cycle questions'),()=>{draft.mode='condition';render()},draft.mode==='condition');
  button(T('계속하기','Continue'),()=>go('consent'),'primary',!draft.mode);
 }else if(step==='consent'){
  heading(T('내 기록은, 내 선택으로','Your records, your choice'),T('기록을 시작하기 전에 정보 이용 범위를 확인해 주세요.','Review how your information is used before you start.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="quiet">${icon('lock')}${T('파트너에게는 기본으로 공유되지 않아요.','Nothing is shared with a partner by default.')}</div><div class="card"><h3>${T('건강 정보 이용 동의','Health information consent')}</h3><p>${draft.mode==='cycle'?T('생리 날짜와 주기, 직접 입력한 몸 상태와 기분, 메모를 기록 보관과 참고 예측에 이용합니다.','Period dates, cycle details, the condition, mood and notes you enter are used to store your records and provide reference estimates.'):T('직접 입력한 몸 상태와 기분, 메모를 기록 보관과 확인에 이용합니다. 생리 날짜를 묻지 않습니다.','The condition, mood and notes you enter are used to store and display your records. No period dates are requested.')}</p><p>${T('삭제나 동의 철회 전까지 보관하며, 설정에서 철회하거나 자료를 삭제할 수 있습니다. 철회하면 건강 정보 기록과 예측 이용이 중단됩니다.','Records are retained until deletion or withdrawal. You can withdraw consent or delete data in settings. Withdrawal stops health recording and estimates.')}</p></div><label class="consent"><input type="checkbox" id="consent" ${draft.consent?'checked':''}>${T('설명된 건강 정보 이용에 동의합니다.','I consent to the health information use described above.')}</label><p class="hint">${T('실제 앱에서는 개인정보 처리방침, 보관과 철회 범위를 원문으로 연결합니다. 공유 동의는 별도로 받습니다.','The app will link the privacy policy and retention and withdrawal details. Sharing has separate controls.')}</p>`);
  $('consent').onchange=e=>{draft.consent=e.target.checked;render()};button(T('동의하고 계속하기','Agree and continue'),()=>go(draft.mode==='cycle'?'date':'tutorial'),'primary',!draft.consent);button(T('동의하지 않고 돌아가기','Go back without agreeing'),()=>go('purpose'),'text');
 }else if(['date','cycle','period'].includes(step)){
  const data={date:[T('최근 생리는 언제 시작했나요?','When did your last period start?'),T('모르면 건너뛰어도 괜찮아요.','It is okay to skip if you are unsure.'),'date',T('시작 날짜','Start date')],cycle:[T('보통 며칠 간격인가요?','How long is your usual cycle?'),T('모르면 기록을 쌓으며 알아가요.','If you are unsure, start with your records.'),'number',T('주기 간격, 일','Cycle length, days')],period:[T('생리는 보통 며칠 하나요?','How many days does your period last?'),T('정확하지 않아도 나중에 바꿀 수 있어요.','You can change this later.'),'number',T('생리 기간, 일','Period length, days')]}[step];
  heading(data[0],data[1]);$('body').insertAdjacentHTML('beforeend',`<div class="field"><label for="value">${data[3]}</label><input id="value" type="${data[2]}" value="${esc(draft[step])}" ${step==='cycle'?'min="15" max="90"':step==='period'?'min="1" max="14"':''}></div><p class="hint">${T('참고용 예상일은 충분한 정보가 있을 때만 표시해요.','Reference estimates appear only when enough information is available.')}</p>`);
  const current=step,next={date:'cycle',cycle:'period',period:'tutorial'}[step];$('value').oninput=e=>draft[current]=e.target.value;
  button(T('계속하기','Continue'),()=>{const v=$('value');if(!v.value||!v.checkValidity()){v.reportValidity();return;}go(next)});button(T('모르겠어요, 건너뛰기','Not sure, skip'),()=>go(next),'text');
 }else if(step==='tutorial'){
  heading(T('오늘은 한 가지만 남겨도 돼요','One small note is enough'),T('완벽한 기록보다, 지금의 나를 살펴요.','Take a moment for yourself, at your own pace.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="card lavender"><div class="row"><span class="small-label">${T('오늘의 기록','Today’s note')}</span><span class="example">${T('예시','Sample')}</span></div><h3>${icon('leaf')} ${T('편안해요','Feeling calm')}</h3><p>${T('오늘은 그냥 이야기를 들어줬으면 좋겠어요.','I would love someone to listen today.')}</p><span class="pill">${icon('lock')}${T('나만 보기','Only me')}</span></div><p class="quiet">${icon('journal')}${T('몸 상태, 마음, 원하는 배려 중 필요한 것만 골라요.','Choose the body, mood or care details you want to record.')}</p>`);
  button(T('이렇게 기록할게요','Got it'),()=>go('share'));
 }else if(step==='share'){
  heading(draft.mode==='cycle'?T('함께 나누고 싶은 사람이 있나요?','Someone you would like to share with?'):T('받은 공유 코드가 있나요?','Do you have a partner code?'),T('연결은 선택이에요. 혼자 기록해도 괜찮아요.','Connecting is optional. You can keep this space for yourself.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="card sage">${icon('pair')}<h3>${T('각자의 기록, 선택한 만큼만','Your own records. Your own choices.')}</h3><p>${T('둘 다 연결을 수락한 뒤에도 공유할 항목은 직접 골라요.','Both people accept the connection and choose what to share.')}</p></div>`);
  button(draft.mode==='cycle'?T('초대 방법 보기','See how to invite'):T('공유 코드 입력 예시','Example: enter a code'),()=>go(draft.mode==='cycle'?'invite':'receive'));
  button(T('지금은 혼자 시작하기','Start on my own for now'),()=>go('home'),'secondary');
 }else if(step==='invite'||step==='receive'){
  heading(step==='invite'?T('초대는 가볍게, 공유는 천천히','Invite gently. Share at your pace.'):T('받은 코드를 입력해요','Enter the code you received'),T('아직 어떤 기록도 공유되지 않았어요.','No records have been shared.'));
  $('body').insertAdjacentHTML('beforeend',step==='invite'?`<div class="card"><span class="example">${T('예시 코드, 실제 사용 불가','Sample code, not valid')}</span><h3 style="font-size:28px;letter-spacing:.2em;margin-top:12px">123 456</h3></div>`:`<div class="field"><label for="code">${T('공유 코드, 설계 예시','Partner code, design sample')}</label><input id="code" inputmode="numeric" placeholder="123456" maxlength="6"></div>`);
  button(T('공유 선택 화면 예시','Example: sharing choices'),()=>go('sharing'));button(T('나중에 할게요','Maybe later'),()=>go('home'),'text');
 }else if(step==='sharing'){
  heading(T('나누고 싶은 것만 골라요','Share only what feels right'),T('두 항목 모두 꺼진 상태로 시작해요. 언제든 바꿀 수 있어요.','Both choices start off. You can change them anytime.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="card">${['mood','energy'].map(k=>`<label class="switch-row"><input type="checkbox" id="share-${k}" ${sharing[k]?'checked':''}>${k==='mood'?T('내가 남긴 기분','The mood I record'):T('내가 남긴 기력','The energy I record')}</label>`).join('')}</div><p class="quiet">${icon('lock')}${T('메모와 주기 날짜는 계속 비공개예요.','Notes and cycle dates stay private.')}</p>`);
  ['mood','energy'].forEach(k=>$(`share-${k}`).onchange=e=>sharing[k]=e.target.checked);button(T('선택한 예시 확인','Confirm sample choices'),()=>go('home'));
 }else if(step==='home'){
  heading(T('오늘의 나를 살펴요','A moment for you'),T('조금 느린 하루여도 괜찮아요.','There is room for a slower day.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="card lavender"><div class="row"><span class="small-label">${T('10월 25일 일요일','Sunday, October 25')}</span><span class="example">${T('예시','Sample')}</span></div><h3>${draft.mood?`${icon(moodOptions.find(x=>x[0]===draft.mood)[1])} ${esc(T(moodOptions.find(x=>x[0]===draft.mood)[2],moodOptions.find(x=>x[0]===draft.mood)[3]))}`:T('오늘은 어떤 하루인가요?','How are you feeling today?')}</h3><p>${T('한 가지 마음부터 남겨보세요.','Start with one feeling.')}</p><button id="write" class="primary">${draft.mood?T('오늘 기록 수정','Edit today’s note'):T('오늘 기록하기','Record today')}</button></div><div class="quiet">${icon('lock')}${T('기록은 기본으로 나만 볼 수 있어요.','Records are private by default.')}</div><div class="card"><div class="row"><h3>${T('나의 일주일','My week')}</h3><span class="example">${T('예시 기록','Sample records')}</span></div>${week()}<p>${T('비어 있는 날도, 나의 하루예요.','The quiet days are yours, too.')}</p></div>`);$('write').onclick=()=>go('record');tabs();
  if(account==='guest')button(T('나중에 계정 연결 예시','Example: connect an account later'),()=>go('link'),'text');
 }else if(step==='record'){
  heading(T('지금, 어떤 마음인가요?','How are you feeling right now?'),T('나에게 맞는 말 하나를 골라요.','Choose a word that feels like you.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="moods">${moodOptions.map(([v,i,ko,en])=>`<button class="mood ${draft.mood===v?'selected':''}" data-mood="${v}" aria-pressed="${draft.mood===v}">${icon(i)}${T(ko,en)}</button>`).join('')}</div><div class="field"><label for="note">${T('짧은 메모, 선택','A small note, optional')}</label><textarea id="note" maxlength="300" placeholder="${T('오늘 나에게 해주고 싶은 말','A few words for yourself')}">${esc(draft.note)}</textarea></div><p class="quiet">${icon('lock')}${T('이 메모는 나만 봐요.','This note is only for you.')}</p>`);
  document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{draft.mood=b.dataset.mood;render()});$('note').oninput=e=>draft.note=e.target.value;button(T('기록 저장 예시','Example: save note'),()=>go('saved'),'primary',!draft.mood);
 }else if(step==='saved'){
  $('body').innerHTML=`<div class="success">✓</div>`; $('body').insertAdjacentHTML('beforeend',`<h2>${T('오늘의 나를 남겼어요','A little note for today')}</h2><p class="desc">${T('이 예시는 서버에 저장되지 않아요. 실제 앱에서는 저장 확인 뒤 완료를 표시해요.','This sample is not saved to a server. The app confirms saving before showing success.')}</p><div class="card lavender"><h3>${T('지금의 나도 충분해요.','You have done enough for today.')}</h3></div>`);button(T('오늘로 돌아가기','Back to today'),()=>go('home'));
 }else if(step==='calendar'){
  heading(T('쌓인 하루를 돌아봐요','Your days, gently reflected'),T('기록한 만큼만 보여드려요.','A reflection of what you recorded.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="row"><span class="small-label">${T('10월 19일 – 25일','October 19–25')}</span><span class="example">${T('예시 데이터','Sample data')}</span></div>`);
  if(empty){$('body').insertAdjacentHTML('beforeend',`<div class="empty">${icon('journal')}<h3>${T('아직 그려지지 않은 하루들','Your story starts here')}</h3><p class="desc">${T('첫 기록을 남기면 이곳에 차곡차곡 모여요.','Your days will gather here as you record them.')}</p></div>`);button(T('첫 기록 남기기','Write your first note'),()=>go('record'))}
  else $('body').insertAdjacentHTML('beforeend',`<div class="card"><h3>${T('이번 주에 남긴 마음','Feelings recorded this week')}</h3><div class="chart" role="img" aria-label="${T('예시, 7일 중 4일 기록. 편안함 2일, 지침 1일, 기분 좋음 1일. 미기록 3일.','Sample: 4 of 7 days recorded. Calm 2 days, tired 1 day, bright 1 day. 3 days without records.')}">${[[T('편안함','Calm'),2],[T('지침','Tired'),1],[T('기분 좋음','Bright'),1]].map(([label,n])=>`<div class="bar-row"><span>${label}</span><div class="bar-track"><div class="bar-fill" style="width:${n/4*100}%"></div></div><span>${n}${T('일',' d')}</span></div>`).join('')}</div><p>${T('7일 중 4일 기록, 미기록 3일.<br>막대는 기록한 4일 중의 비율입니다.','4 of 7 days recorded. 3 days without records.<br>Bars show the share of the 4 recorded days.')}</p></div><p class="hint">${T('마음의 좋고 나쁨을 평가하거나 파트너의 상태를 추측하지 않아요.','This does not score feelings or infer your partner’s state.')}</p>`);tabs();
 }else if(step==='partner'){
  heading(T('마음을 나누는 작은 방법','Small ways to be there'),T('먼저 물어보고, 편한 만큼 함께해요.','Ask first. Be there in a way that feels right.'));
  $('body').insertAdjacentHTML('beforeend',`<div class="card sage">${icon('cup')}<h3>${T('“오늘은 어떻게 함께하면 좋을까?”','“What would feel helpful today?”')}</h3><p>${T('답을 정하기보다, 이야기를 들어주세요.','Leave room for their answer.')}</p></div><div class="card"><h3>${T('아직 연결하지 않았어요','You are not connected yet')}</h3><p>${T('혼자 기록해도 괜찮아요. 연결은 언제든 선택할 수 있어요.','You can record on your own and choose to connect later.')}</p></div>`);button(T('파트너 연결하기','Connect with a partner'),()=>go('share'));tabs();
 }else if(step==='link'){
  heading(T('기록을 이어갈 준비','Keep your records with you'),T('이메일 계정을 연결해도 지금 기록과 파트너 연결은 유지해요.','Connecting an email account keeps your current records and partner connection.'));
  button(T('연결 성공 예시','Example: connection succeeds'),()=>{account='email';go('home')});button(T('이미 쓰는 이메일인 경우 예시','Example: email already in use'),()=>go('conflict'),'secondary');
 }else if(step==='conflict'){
  heading(T('이미 사용 중인 이메일이에요','That email is already in use'),T('기록을 자동으로 합치지 않았어요. 현재 기록은 그대로 유지돼요.','No records were merged. Your current records are unchanged.'));button(T('현재 기록 유지하기','Keep current records'),()=>go('home'));
 }
}
function week(){const names=T(['월','화','수','목','금','토','일'],['M','T','W','T','F','S','S']);const values=['leaf',null,'moon',null,'sun','leaf',null];return `<div class="week" role="list" aria-label="${T('예시 주간 기록','Sample weekly records')}">${names.map((x,i)=>`<div class="day" role="listitem" aria-label="${19+i}${T('일',' October')}, ${values[i]?T(values[i]==='leaf'?'편안함':values[i]==='moon'?'지침':'기분 좋음',values[i]==='leaf'?'calm':values[i]==='moon'?'tired':'bright'):T('기록 없음','not recorded')}">${x}<span class="dot ${values[i]?'filled':''} ${i===6?'today':''}">${values[i]?icon(values[i]):'–'}</span>${19+i}</div>`).join('')}</div>`}
$('back').onclick=()=>{if(history.length){step=history.pop();render()}};$('language').onclick=()=>{lang=lang==='ko'?'en':'ko';render()};$('scene').onchange=e=>{empty=e.target.value==='empty';go(empty?'calendar':e.target.value)};$('reset').onclick=()=>{history=[];step='entry';draft={mode:null,consent:false,date:'',cycle:'',period:'',mood:null,note:''};sharing={mood:false,energy:false};account='guest';empty=false;$('scene').value='entry';render()};render();
</script></html>
